services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      # Код проекта: изменения на хосте сразу видны в контейнере.
      - .:/app
      # Отдельный volume под media/, чтобы загруженные файлы не терялись
      # при пересборке образа (даже если bind-mount кода выше уберут).
      - media_data:/app/media
    env_file:
      - .env

volumes:
  media_data:
