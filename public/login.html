<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskRoman — Вход</title>
    <link rel="icon" href="./static/img/favicon.ico">
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="border-bottom bg-white py-2">
        <div class="container d-flex flex-wrap align-items-center gap-3 py-2">

            <a href="./index.html" class="text-decoration-none text-dark flex-shrink-0">
                <span class="fs-3 fw-semibold">AskRoman</span>
            </a>

            <form class="header-search d-flex flex-grow-1">
                <div class="input-group">
                    <input class="form-control" type="search" placeholder="Search">
                </div>
            </form>

            <div class="d-flex gap-3 flex-shrink-0">
                <a href="./login.html" class="text-decoration-none fw-medium">log in</a>
                <a href="./signup.html" class="text-decoration-none fw-medium">register</a>
            </div>
        </div>
    </header>

    <div class="container flex-grow-1 my-3">
        <div class="row g-4">
            <main class="col-12 col-md-8 d-flex flex-column gap-3">
                <section class="card">
                    <div class="card-body">
                        <h1 class="h4 card-title mb-3">Log In</h1>

                        <form action="#" method="post">
                            <div class="row mb-3">
                                <label for="login-login" class="col-sm-2 col-form-label">Login</label>
                                <div class="col-sm-10">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="login-login"
                                        name="login"
                                        required
                                        placeholder="Enter your login here">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label for="login-password" class="col-sm-2 col-form-label">Password</label>
                                <div class="col-sm-10">
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="login-password"
                                        name="password"
                                        required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-sm-10 offset-sm-2">
                                    <button type="submit" class="btn btn-primary">Log in!</button>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-sm-10 offset-sm-2">
                                    <a href="./signup.html" class="text-decoration-none">create new account</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>
            </main>

            <aside class="col-12 col-md-4 d-flex flex-column gap-3">
                <section class="card card-body">
                    <h2 class="h5">Popular Tags</h2>
                    <div class="d-flex flex-wrap gap-2">
                        <a href="./tags.html" class="text-decoration-none">perl</a>
                        <a href="./tags.html" class="text-decoration-none">python</a>
                        <a href="./tags.html" class="text-decoration-none">TechnoPark</a>
                        <a href="./tags.html" class="text-decoration-none">MySQL</a>
                        <a href="./tags.html" class="text-decoration-none">django</a>
                        <a href="./tags.html" class="text-decoration-none">Mail.Ru</a>
                        <a href="./tags.html" class="text-decoration-none">Voloshin</a>
                        <a href="./tags.html" class="text-decoration-none">Firefox</a>
                    </div>
                </section>

                <section class="card card-body">
                    <h2 class="h5">Best Members</h2>
                    <ul class="list-unstyled d-flex flex-column gap-1 mb-0">
                        <li><a href="./profile.html">Mr. Freeman</a></li>
                        <li><a href="./profile.html">Dr. House</a></li>
                        <li><a href="./profile.html">Bender</a></li>
                        <li><a href="./profile.html">Queen Victoria</a></li>
                        <li><a href="./profile.html">V. Pupkin</a></li>
                    </ul>
                </section>
            </aside>
        </div>
    </div>

    <footer class="border-top bg-white py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 AskRoman. All rights reserved.</p>
        </div>
    </footer>

    <script src="./static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
