{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AskRoman{% endblock %}</title>

    <link rel="icon" href="{% static 'img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="border-bottom bg-white py-2">
        <div class="container d-flex flex-wrap align-items-center gap-3 py-2">

            <a href="{% url 'index' %}"
               class="text-decoration-none text-dark flex-shrink-0">
                <span class="fs-3 fw-semibold">AskRoman</span>
            </a>

            <form class="header-search d-flex flex-grow-1">
                <div class="input-group">
                    <input class="form-control" type="search"
                           placeholder="Search">
                </div>
            </form>

            <a href="{% url 'ask' %}" class="btn btn-success">ASK!</a>

            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                <img src="{% static 'img/avatar-placeholder.png' %}"
                     alt="Roman avatar"
                     class="rounded-circle"
                     width="50" height="50">

                <div class="d-flex flex-column">
                    <a href="{% url 'profile' %}"
                       class="text-decoration-none text-dark fw-medium">
                        Roman
                    </a>

                    <div class="d-flex gap-2">
                        <a href="{% url 'profile' %}"
                           class="btn btn-outline-secondary btn-sm">
                            settings
                        </a>

                        <a href="{% url 'login' %}"
                           class="btn btn-outline-danger btn-sm">
                            log out
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <div class="container flex-grow-1 my-3">
        <div class="row g-4">

            <main class="col-12 col-md-8 d-flex flex-column gap-3">
                {% block content %}
                {% endblock %}
            </main>

            {% include 'core/includes/sidebar.html' %}

        </div>
    </div>

    <footer class="border-top bg-white py-3">
        <div class="container">
            <p class="mb-0">
                &copy; 2026 AskRoman. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
