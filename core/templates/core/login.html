{% extends 'core/base.html' %}

{% block title %}Вход — AskRoman{% endblock %}

{% block content %}

<section class="card">
    <div class="card-body">

        <h1 class="h4 card-title mb-3">Log In</h1>

        <form method="post">
            {% csrf_token %}

            <div class="row mb-3">
                <label for="login-login"
                       class="col-sm-2 col-form-label">
                    Login
                </label>

                <div class="col-sm-10">
                    <input
                        type="text"
                        class="form-control"
                        id="login-login"
                        name="login"
                        required
                        placeholder="Enter your login here">
                </div>
            </div>

            <div class="row mb-3">
                <label for="login-password"
                       class="col-sm-2 col-form-label">
                    Password
                </label>

                <div class="col-sm-10">
                    <input
                        type="password"
                        class="form-control"
                        id="login-password"
                        name="password"
                        required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        Log in!
                    </button>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-10 offset-sm-2">
                    <a href="{% url 'signup' %}"
                       class="text-decoration-none">
                        Create new account
                    </a>
                </div>
            </div>

        </form>

    </div>
</section>

{% endblock %}
